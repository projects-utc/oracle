server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sephora-oracle-backend
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@//58.186.149.175:32012/FREEPDB1}
    username: ${ORACLE_DB_USER:ora_u8k4m2p9}
    password: ${ORACLE_DB_PASSWORD:Or4cl3_9xK2mP7vQ4wL}
